name: Build Windows Kernel Driver

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION_FILE_PATH: ./OAC.sln
  BUILD_CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
        vs-version: '[17.0,18.0)'

    - name: Build solution
      run: |
        msbuild ${{ env.SOLUTION_FILE_PATH }} /m /t:Rebuild `
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
          /p:Platform=${{ env.PLATFORM }} `
          /p:PreferredToolArchitecture=x64 `
          /p:Inf2CatUseLocalTime=true

    - name: Upload unsigned build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: oac-release-x64-unsigned
        if-no-files-found: error
        path: |
          ${{ env.PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/OAC.sys
          ${{ env.PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/OAC-Client.exe
          ${{ env.PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/OAC-Protocol-Test.exe
          ${{ env.PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/*.pdb
          ${{ env.PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/OAC/OAC.inf
          ${{ env.PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/OAC/oac.cat
